name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend and frontend JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/nohunger_test?replicaSet=rs0
      REQUIRE_MONGO_TESTS: "true"
    defaults:
      run:
        working-directory: Nohunger
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22.23.3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: Nohunger/.nvmrc
          cache: npm
          cache-dependency-path: Nohunger/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Start and initialize transaction-capable MongoDB replica set
        working-directory: .
        run: |
          docker run --detach --name nohunger-test-mongodb --publish 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          mongo_ready=false
          for attempt in {1..30}; do
            if docker exec nohunger-test-mongodb mongosh --quiet --eval "db.adminCommand({ping:1}).ok"; then
              mongo_ready=true
              break
            fi
            sleep 1
          done
          test "$mongo_ready" = true
          docker exec nohunger-test-mongodb mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          replica_ready=false
          for attempt in {1..30}; do
            if docker exec nohunger-test-mongodb mongosh --quiet --eval "quit(rs.status().myState === 1 ? 0 : 1)"; then
              replica_ready=true
              break
            fi
            sleep 1
          done
          test "$replica_ready" = true

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit all dependencies (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test -- --ci

      - name: Run transaction integration tests explicitly
        run: npm run test:integration -- --ci

  e2e:
    name: Playwright acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/nohunger_e2e?replicaSet=rs0
      JWT_SECRET: ci-only-jwt-secret
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD_HASH: $2b$10$VeGFfdnNQhZIcwRrwF2RJeSuQkhXMDYhknkzIebg6kMaaG0IZ.zmy
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_PASSWORD: E2eTestPassword123!
      E2E_BASE_URL: http://127.0.0.1:4000
      ALLOWED_ORIGIN: http://127.0.0.1:4000
      PORT: "4000"
      AUTH_RATE_LIMIT_MAX: "100"
    defaults:
      run:
        working-directory: Nohunger
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22.23.3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: Nohunger/.nvmrc
          cache: npm
          cache-dependency-path: Nohunger/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate isolated E2E configuration
        run: |
          for name in MONGO_URI JWT_SECRET ADMIN_EMAIL ADMIN_PASSWORD_HASH E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_BASE_URL ALLOWED_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for the isolated Playwright environment."
              exit 1
            fi
          done
          if [ "$ADMIN_EMAIL" != "$E2E_ADMIN_EMAIL" ]; then
            echo "::error::ADMIN_EMAIL must match E2E_ADMIN_EMAIL."
            exit 1
          fi
          if [ "$MONGO_URI" != "mongodb://127.0.0.1:27017/nohunger_e2e?replicaSet=rs0" ]; then
            echo "::error::MONGO_URI must target the isolated local nohunger_e2e database."
            exit 1
          fi
          if [ "$ALLOWED_ORIGIN" != "$E2E_BASE_URL" ]; then
            echo "::error::ALLOWED_ORIGIN must match E2E_BASE_URL for browser and Socket.IO requests."
            exit 1
          fi

      - name: Start and initialize disposable E2E MongoDB replica set
        working-directory: .
        run: |
          docker run --detach --name nohunger-e2e-mongodb --publish 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          mongo_ready=false
          for attempt in {1..30}; do
            if docker exec nohunger-e2e-mongodb mongosh --quiet --eval "db.adminCommand({ping:1}).ok"; then
              mongo_ready=true
              break
            fi
            sleep 1
          done
          test "$mongo_ready" = true
          docker exec nohunger-e2e-mongodb mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          replica_ready=false
          for attempt in {1..30}; do
            if docker exec nohunger-e2e-mongodb mongosh --quiet --eval "quit(rs.status().myState === 1 ? 0 : 1)"; then
              replica_ready=true
              break
            fi
            sleep 1
          done
          test "$replica_ready" = true

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application and wait for readiness
        run: |
          nohup node server.js > server.log 2>&1 < /dev/null &
          echo $! > server.pid
          ready=false
          for attempt in {1..60}; do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4000/ready)" = "200" ]; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat server.pid)"; then
              cat server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat server.log
            exit 1
          fi

      - name: Run complete Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright reports and traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-artifacts
          path: |
            Nohunger/playwright-report/
            Nohunger/test-results/
            Nohunger/server.log
          if-no-files-found: warn

      - name: Stop application and remove E2E MongoDB
        if: always()
        working-directory: .
        run: |
          if [ -f Nohunger/server.pid ]; then
            kill "$(cat Nohunger/server.pid)" 2>/dev/null || true
            for attempt in {1..10}; do
              if ! kill -0 "$(cat Nohunger/server.pid)" 2>/dev/null; then
                break
              fi
              sleep 1
            done
          fi
          docker rm --force nohunger-e2e-mongodb 2>/dev/null || true
